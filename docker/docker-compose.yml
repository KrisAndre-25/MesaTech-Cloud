version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: mesatech-db
    environment:
      POSTGRES_DB: mesatech_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
